    Account:
      type: object
      additionalProperties: false
      required:
        - accountId
        - createdOn
        - currency
        - type
      properties:
        accountId:
          type: string
          description: Account ID
        createdOn:
          type: string
          format: date-time
          description: Account creation date/time.
        currency:
          $ref: '#/components/schemas/Currency'
        name:
          type: string
          description: Account short name.
        type:
          type: string
          enum:
            - VERSIONED
            - UNVERSIONED

    NewAccount:
      type: object
      additionalProperties: false
      required:
        - currency
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        name:
          type: string
          description: Account short name
        type:
          type: string
          enum:
            - VERSIONED
            - UNVERSIONED
          description: >-
            Determines whether performing a posting is dependent on the balance
            of the account or not. Defaults to VERSIONED if not supplied.

    BalanceList:
      type: object
      additionalProperties: false
      description: Balances for the accounts requested.
      required:
        - at
        - balances
      properties:
        at:
          type: string
          format: date-time
          description: Account balance at this date/time
        balances:
          type: array
          items:
            $ref: '#/components/schemas/Balance'

    Balance:
      type: object
      additionalProperties: false
      description: Ledger balance at a point in time.
      required:
        - accountId
        - balance
      properties:
        accountId:
          type: string
          description: Account ID
        balance:
          type: string

    EntriesList:
      type: object
      additionalProperties: false
      required:
        - accountEntries
      properties:
        accountEntries:
          type: array
          items:
            $ref: '#/components/schemas/Entries'

    Entries:
      type: object
      additionalProperties: false
      required:
        - entries
        - accountId
      properties:
        accountId:
          type: string
          description: Account ID
        entries:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/Entry'

    Entry:
      type: object
      additionalProperties: false
      required:
        - entryId
        - createdOn
        - postings
      properties:
        entryId:
          type: string
          description: Journal entry ID
        createdOn:
          type: string
          format: date-time
          description: Journal entry creation date/time
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Post'

    ResponseEntry:
      type: object
      additionalProperties: false
      required:
        - entryId
        - createdOn
        - postings
      properties:
        entryId:
          type: string
          description: Journal entry ID
        createdOn:
          type: string
          format: date-time
          description: Journal entry creation date/time
        postings:
          type: array
          items:
            $ref: '#/components/schemas/ResponsePost'

    NewEntry:
      type: object
      additionalProperties: false
      required:
        - postings
      properties:
        postings:
          type: array
          description: List of posts contained within the journal entry.
          items:
            $ref: '#/components/schemas/Post'

    Post:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
        - type
        - accountId
      properties:
        amount:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        type:
          $ref: '#/components/schemas/Type'
        createdOn:
          type: string
          format: date-time
        accountId:
          type: string
          description: account ID

    ResponsePost:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
        - type
        - accountId
        - createdOn
      properties:
        amount:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        type:
          $ref: '#/components/schemas/Type'
        createdOn:
          type: string
          format: date-time
        accountId:
          type: string
          description: account ID

    Type:
      type: string
      description: CREDIT or DEBIT
      enum:
        - CREDIT
        - DEBIT

    TotalsList:
      type: array
      additionalProperties: false
      description: Totals of filtered entries for the accounts requested.
      items:
        $ref: '#/components/schemas/Total'
      minItems: 1

    Total:
      type: object
      additionalProperties: false
      description: |
        - The total debit or credit to an account.
        - If debits exceed credits the total value will be negative.
        - AccountIds may include idFragments formatted as: :accountId/:idFragment1/:idFragment2/:idFragment3.
      required:
        - accountId
        - total
      properties:
        accountId:
          type: string
          description: account ID
        total:
          type: string
          minLength: 1

  parameters:
    ifNoneMatch:
      in: header
      name: If-None-Match
      description: If-None-Match header
      schema:
        type: string

    idFragment1:
      in: path
      required: true
      name: idFragment1
      description: Fragment of a unique identifier.
      schema:
        type: string

    idFragment2:
      in: path
      required: true
      name: idFragment2
      description: Fragment of a unique identifier.
      schema:
        type: string

    idFragment3:
      in: path
      required: true
      name: idFragment3
      description: Fragment of a unique identifier.
      schema:
        type: string

    ifMatch:
      in: header
      name: If-Match
      description: If-Match header
      schema:
        type: string

    accountId:
      in: path
      name: accountId
      description: Unique identifier for an account.
      required: true
      schema:
        type: string

    accountIdQuery:
      in: query
      name: accountIds
      description: |
        - UUID for accounts.
        - For accountIds with idFragments, format like so :accountId/:idFragment1/:idFragment2/:idFragment3.
      required: true
      schema:
        type: array
        minItems: 1
        items:
          type: string

    filterAccountIdQuery:
      in: query
      name: filteredAccounts
      description: |
        - UUIDs for accounts to filter entries by.
        - For accountIds with idFragments, format like so :accountId/:idFragment1/:idFragment2/:idFragment3.
      schema:
        type: array
        minItems: 1
        items:
          type: string

    at:
      in: query
      name: at
      description: Returns data createdOn before this time.
      required: true
      schema:
        type: string
        format: date-time

    entryId:
      in: path
      name: entryId
      description: Unique identifier for an entry.
      required: true
      schema:
        type: string

    toDate:
      in: query
      name: toDate
      description: >-
        Return entries created before this time. Must be at least 1 second in
        the past.
      required: true
      schema:
        type: string
        format: date-time

    fromDate:
      in: query
      name: fromDate
      description: >-
        Return entries created at or after this time. Must be at least 1 second
        in the past.
      schema:
        type: string
        format: date-time

    createdOn:
      in: header
      name: Created-On
      description: used to set resource creation date.
      schema:
        type: string
        format: date-time

    lastModified:
      in: header
      name: Last-Modified
      description: used to set resource creation date.
      required: false
      schema:
        type: string
        format: date-time

  responses:
    Ping:
      description: ping successful response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ping'

    ServerError:
      description: Server Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Requested resource not found.

    Conflict:
      description: Conflict

    PreConditionFailed:
      description: Version tag mismatch

    BadRequest:
      description: Bad Request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Created:
      description: Created.
      headers:
        Created-On:
          $ref: '#/components/headers/Created-On'
        Updated-On:
          $ref: '#/components/headers/Updated-On'
        Last-Modified:
          $ref: '#/components/headers/Last-Modified'

    AccountObtained:
      description: Account obtained.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Account'
      headers:
        Created-On:
          $ref: '#/components/headers/Created-On'
        Updated-On:
          $ref: '#/components/headers/Updated-On'
        Last-Modified:
          $ref: '#/components/headers/Last-Modified'

  headers:
    Created-On:
      description: When the resource was created.
      required: true
      schema:
        type: string
        format: date-time

    Updated-On:
      description: When the resource was created (all resources are immutable).
      required: true
      schema:
        type: string
        format: date-time

    Last-Modified:
      description: When the resource was created (all resources are immutable).
      required: true
      schema:
        type: string
        format: date-time

    ETag:
      description: Version information
      required: true
      schema:
        type: string
