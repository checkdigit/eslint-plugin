  parameters:
    messageId:
      in: path
      name: messageId
      description: Unique identifier for a message
      required: true
      schema:
        type: string

    at:
      in: query
      name: at
      description: >-
        Identifies at what point in time the data should be returned. Must not
        be in the future.
      required: true
      schema:
        type: string
        format: date-time

    cardId:
      in: query
      name: cardId
      description: Unique identifier for an account
      required: true
      schema:
        type: array
        minItems: 1
        items:
          type: string

    toDate:
      in: query
      name: toDate
      description: >-
        Return entries created before this time. Must be at least 1 second in
        the past.
      required: true
      schema:
        type: string
        format: date-time

    fromDate:
      in: query
      name: fromDate
      description: >-
        Return entries created at or after this time. Must be at least 1 second
        in the past.
      schema:
        type: string
        format: date-time

    lastModified:
      name: Last-Modified
      in: header
      description: Last-Modified header
      required: false
      schema:
        type: string
        format: date-time

    createdOn:
      name: Created-On
      in: header
      description: CreatedOn-header
      required: false
      schema:
        type: string
        format: date-time

    responseFields:
      in: query
      name: fields
      description: The message response fields to return
      required: true
      schema:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/ResponseField'

    requestFields:
      in: query
      name: fields
      description: The message request fields to return
      required: true
      schema:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/RequestField'

  responses:
    Ping:
      description: ping successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ping'

    ServerError:
      description: Server Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    Last-Modified:
      description: Date and time at which the record was last modified
      required: true
      schema:
        type: string
        format: date-time

    Created-On:
      description: CreatedOn timestamp for the newly created record
      required: true
      schema:
        type: string
        format: date-time

    Updated-On:
      description: UpdatedOn timestamp for the existing record
      required: true
      schema:
        type: string
        format: date-time
