name: Coverage

on:
  pull_request:
    branches: [main]

concurrency:
  group: coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: 'npm'
      - name: Install latest npm
        run: npm install --global npm@latest
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Calculate Code Coverage
        run: npm run ci:coverage
      - name: Upload Base Coverage
        uses: actions/upload-artifact@v7
        with:
          name: base-coverage
          path: coverage/lcov.info
          if-no-files-found: error

  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: 'npm'
      - name: Install Latest npm
        run: npm install --global npm@latest
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Calculate Code Coverage
        run: npm run ci:coverage
      - name: Upload PR Coverage
        uses: actions/upload-artifact@v7
        with:
          name: pr-coverage
          path: coverage/lcov.info
          if-no-files-found: error

  report:
    name: Coverage
    needs: [base, pr]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Require Successful Coverage Jobs
        if: ${{ needs.base.result != 'success' || needs.pr.result != 'success' }}
        run: exit 1
      - name: Download Base Coverage
        uses: actions/download-artifact@v8
        with:
          name: base-coverage
          path: coverage
      - name: Download PR Coverage
        uses: actions/download-artifact@v8
        with:
          name: pr-coverage
          path: coverage-pr
      - name: Post Coverage Report
        uses: checkdigit/github-actions/coverage-reporter@main
        with:
          coverage-results-folder-pr: 'coverage-pr'
          coverage-results-folder-base: 'coverage'
          delete-old-comments: true
