name: Check Pull Request Reviews

on:
  pull_request_review:
    types: [submitted]

jobs:
  checkPrReviews:
    name: Check PR Reviews
    runs-on: ubuntu-latest
    steps:
      - name: Perform Check of PR Reviews
        uses: checkdigit/github-actions/check-pr-reviews@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}